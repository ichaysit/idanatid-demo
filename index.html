<title>IDANATID Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Heebo:wght@400;500;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: idanatid.com language — rounded gradient hero card, uppercase display type, pill buttons, glass.
   Surfaces: landing (#welcome), projects (#projects), studio (#studio: chat | live preview | dashboard). */
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
:root{
  --navy:#142238; --navy-2:#1b3a5e; --blue:#2f6fb0; --sky:#8fd3e8; --violet:#8b80d4; --sun:#f0dc9a;
  --bg:#ffffff; --bg-2:#eef3f7; --surface:#ffffff; --panel:#f6f9fb; --ink:#142238; --ink-2:#3c4d66; --muted:#566882;
  --hair:#dce5ec; --ghost:#d3dfe9; --accent:#2f6fb0; --focus:#8fd3e8;
  --good:#1d7a46; --good-soft:#dff3e7; --warn:#a35b05; --warn-soft:#fbeed6; --bad:#b42318; --bad-soft:#fde7e5;
  --f:"Onest","Heebo",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --rc:1.5rem; --rl:2rem; --rp:62.5rem; --shadow:0 30px 60px -30px rgba(20,34,56,.35);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1322; --bg-2:#121d31; --surface:#111b2d; --panel:#0e182a; --ink:#e9eff7; --ink-2:#bccbe0; --muted:#8da0bb;
  --hair:#22314a; --ghost:#2a3b57; --accent:#8fd3e8;
  --good:#5fd194; --good-soft:#123422; --warn:#f2b45a; --warn-soft:#3a2810; --bad:#ff8a7f; --bad-soft:#3b1716; --shadow:0 30px 60px -30px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1322; --bg-2:#121d31; --surface:#111b2d; --panel:#0e182a; --ink:#e9eff7; --ink-2:#bccbe0; --muted:#8da0bb;
  --hair:#22314a; --ghost:#2a3b57; --accent:#8fd3e8;
  --good:#5fd194; --good-soft:#123422; --warn:#f2b45a; --warn-soft:#3a2810; --bad:#ff8a7f; --bad-soft:#3b1716; --shadow:0 30px 60px -30px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:50;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3,h4{margin:0;line-height:1.1;text-wrap:balance;font-weight:500}
p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;border-radius:var(--rp);padding:.62rem 1.15rem;font-size:.875rem;font-weight:500;border:1px solid var(--hair);background:var(--surface);cursor:pointer;transition:background .25s,border-color .25s,transform .15s;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--ink)} .btn:active{transform:translateY(1px)}
.btn.dark{background:var(--navy);color:#fff;border-color:var(--navy)} .btn.dark:hover{background:var(--navy-2)}
.btn.glow{background:linear-gradient(120deg,#2f6fb0,#8b80d4 55%,#d9b960);color:#fff;border:0}
.btn.ghost{background:transparent} .btn.sm{padding:.4rem .8rem;font-size:.8rem}
.btn:disabled{opacity:.55;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:.4rem;border-radius:var(--rp);padding:.2rem .7rem;font-size:.75rem;font-weight:500;background:var(--bg-2);color:var(--ink-2);white-space:nowrap}
.pill.ok{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.ex{font-size:.68rem;padding:.05rem .5rem;border-radius:var(--rp);background:var(--warn-soft);color:var(--warn);font-weight:500}
.muted{color:var(--muted)} .small{font-size:.82rem}
input[type=text],input[type=tel],input[type=number],input[type=date],input[type=time],input[type=password],select,textarea{background:var(--surface);border:1px solid var(--hair);border-radius:.8rem;padding:.6rem .8rem;width:100%}
textarea{resize:vertical}
label.f{display:flex;flex-direction:column;gap:.3rem;font-size:.82rem;color:var(--ink-2)}
.status{font-size:.85rem;min-height:1.3em;color:var(--ink-2)}
.logo{display:inline-flex;align-items:center;gap:.55rem;font-weight:500;letter-spacing:.2em;text-transform:uppercase;text-decoration:none}
.logo svg{width:26px;height:26px}

/* ---------- Landing ---------- */
.landing{padding-block:.5rem 3rem}
.hero{position:relative;overflow:hidden;border-radius:var(--rl);margin:.5rem;color:#fff;isolation:isolate;background:#1b2a49;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:1.25rem 3rem}
.mesh{position:absolute;inset:-20%;z-index:-1;filter:blur(40px) saturate(115%);
  background:radial-gradient(40% 45% at 18% 30%,#2f6fb0 0%,transparent 70%),radial-gradient(35% 40% at 80% 25%,#8b80d4 0%,transparent 70%),radial-gradient(45% 45% at 70% 80%,#4c8f8a 0%,transparent 70%),radial-gradient(40% 40% at 25% 85%,#b9a56a 0%,transparent 70%),radial-gradient(60% 60% at 50% 50%,#1b3a5e 0%,#142238 80%);
  animation:drift 22s ease-in-out infinite alternate}
@keyframes drift{0%{transform:translate3d(0,0,0) rotate(0)}50%{transform:translate3d(-4%,3%,0) rotate(8deg)}100%{transform:translate3d(3%,-3%,0) rotate(-6deg)}}
.hero-nav{display:flex;align-items:center;gap:1rem;max-width:1200px;margin:0 auto;padding-top:.75rem}
.hero-nav .links{display:flex;gap:.25rem;margin-inline-start:auto}
.glass{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#fff}
.glass:hover{border-color:rgba(255,255,255,.6)}
.hero-body{max-width:1200px;margin:0 auto;padding-top:clamp(2.5rem,7vw,5rem);display:flex;flex-direction:column;gap:1.5rem}
.hero h1{font-size:clamp(2.4rem,7vw,5.4rem);line-height:.95;letter-spacing:-.02em;text-transform:uppercase;max-width:14ch}
.hero .hlead{font-size:clamp(1rem,1.6vw,1.15rem);color:rgba(255,255,255,.82);max-width:40rem}
.prompt-ring{position:relative;width:min(820px,100%);padding:1.5px;border-radius:30px;background:conic-gradient(from var(--a),#BDE6FF,#8B6BFF,#FFE27A,#BDE6FF);animation:spin 9s linear infinite;box-shadow:0 0 90px -12px rgba(139,107,255,.5),0 0 150px -30px rgba(89,195,255,.4)}
@keyframes spin{to{--a:360deg}}
.prompt{border-radius:28.5px;background:rgba(14,24,42,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:1rem 1rem .75rem;display:flex;flex-direction:column;gap:.6rem}
.prompt textarea{background:transparent;border:0;color:#fff;font-size:1.05rem;min-height:5.5rem;padding:.25rem .35rem;resize:none}
.prompt textarea::placeholder{color:rgba(255,255,255,.55)} .prompt textarea:focus{outline:none}
.prompt-bar{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.prompt-bar select{width:auto;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:var(--rp);padding:.35rem .8rem;font-size:.8rem}
.prompt-bar select option{color:#142238}
.send{margin-inline-start:auto;width:42px;height:42px;border-radius:50%;border:0;background:#fff;color:#142238;display:grid;place-items:center;cursor:pointer;transition:transform .15s}
.send:active{transform:scale(.94)} .send:disabled{opacity:.5} .send svg{width:20px;height:20px}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{border-radius:var(--rp);padding:.4rem .85rem;font-size:.8rem;cursor:pointer}
.section{max-width:1200px;margin:0 auto;padding-block:3.5rem 0}
.section h2{font-size:clamp(1.8rem,3.5vw,2.8rem);letter-spacing:-.02em;text-transform:uppercase;line-height:1}
.section .sub{color:var(--muted);max-width:44rem;margin-top:.75rem}
.mods{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1rem;margin-top:1.75rem}
.mod{border-radius:var(--rc);background:var(--bg-2);padding:1.25rem;display:flex;flex-direction:column;gap:.5rem;min-height:9.5rem;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
.mod:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface);color:var(--accent)}
.ic svg{width:20px;height:20px}
.mod b{font-weight:500;font-size:1.02rem}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem;margin-top:1.75rem}
.step{border-radius:var(--rc);border:1px solid var(--hair);padding:1.5rem;display:flex;flex-direction:column;gap:.6rem}
.step .n{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.plans{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1rem;margin-top:1.75rem}
.plan{border-radius:var(--rc);background:var(--bg-2);padding:1.5rem;display:flex;flex-direction:column;gap:.75rem}
.plan.feat{background:var(--navy);color:#fff} .plan.feat .muted{color:rgba(255,255,255,.7)}
.plan .price{font-size:2.4rem;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.plan ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:.45rem;font-size:.9rem}
.plan li{display:flex;gap:.5rem} .plan li::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;margin-top:.5rem;background:var(--sky)}
.plan.cur{outline:2px solid var(--sky);outline-offset:2px}
.options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem;margin-top:1rem}
.opt{border:1px solid var(--hair);border-radius:var(--rc);padding:1.1rem;display:flex;flex-direction:column;gap:.35rem}
.opt b{font-weight:500} .opt .mono{font-size:1.05rem}
.faq{margin-top:1.5rem;display:flex;flex-direction:column}
.faq details{border-bottom:1px solid var(--hair);padding:1rem 0}
.faq summary{cursor:pointer;font-weight:500;font-size:1.05rem}
.faq p{color:var(--ink-2);margin-top:.6rem;max-width:70ch}
.info table.t tbody th{font-size:.88rem;text-transform:none;letter-spacing:0;color:var(--ink);font-weight:500}
.langsel{width:auto;border-radius:var(--rp);padding:.4rem .8rem;font-size:.8rem;border:1px solid var(--hair);background:var(--surface);color:var(--ink)}
.langsel.glass{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.28)} .langsel.glass option{color:#142238}
.ipnav{display:flex;align-items:center;gap:1rem;max-width:760px;margin:0 auto;padding-top:1rem}
.info{max-width:760px;margin:0 auto;padding-block:2.5rem 0;display:flex;flex-direction:column;gap:1.6rem}
.info h1{font-size:clamp(2rem,5vw,3.2rem);letter-spacing:-.02em}
.info .ilead{font-size:1.12rem;color:var(--ink-2);line-height:1.6}
.info h2{font-size:1.2rem;font-weight:600;margin-bottom:.55rem}
.info p,.info li{line-height:1.7;color:var(--ink-2)} .info p+p{margin-top:.55rem}
.info ul{margin:.55rem 0 0;padding-inline-start:1.3rem;display:flex;flex-direction:column;gap:.4rem}
.mailcard{display:flex;flex-wrap:wrap;gap:1rem;align-items:center;justify-content:space-between;border:1px solid var(--hair);background:var(--panel);border-radius:var(--rc);padding:1.25rem 1.4rem}
.mailcard b{font-size:1.25rem;font-weight:600;word-break:break-all}
.foot nav{display:flex;flex-wrap:wrap;gap:.4rem 1.2rem} .foot nav a{color:var(--ink-2);text-decoration:none} .foot nav a:hover,.foot nav a[aria-current]{color:var(--ink);text-decoration:underline;text-underline-offset:4px}
.foot{max-width:1200px;margin:3rem auto 0;padding-top:1.5rem;border-top:1px solid var(--hair);display:flex;flex-wrap:wrap;gap:1rem;justify-content:space-between;color:var(--muted);font-size:.85rem}
.compare{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:1rem}
.compare td,.compare th{padding:.65rem .75rem;border-bottom:1px solid var(--hair);text-align:start;vertical-align:top}
.compare th{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}

/* ---------- App chrome ---------- */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:.75rem;background:var(--bg);border-bottom:1px solid var(--hair);padding-block:.6rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.appbar .proj{display:flex;align-items:center;gap:.5rem;min-width:0}
.appbar .proj b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:24vw}
.grow{flex:1}
.meter{display:flex;align-items:center;gap:.5rem;font-size:.75rem;color:var(--muted);white-space:nowrap}
.meter .bar{width:90px;height:6px;border-radius:9px;background:var(--bg-2);overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--blue);border-radius:9px}
.meter.warn .bar i{background:var(--warn)} .meter.full .bar i{background:var(--bad)}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem;padding:.55rem .9rem;font-size:.85rem;border-bottom:1px solid var(--hair)}
.banner.warn{background:var(--warn-soft);color:var(--warn)} .banner.full{background:var(--bad-soft);color:var(--bad)}
.seg{display:inline-flex;background:var(--bg-2);border-radius:var(--rp);padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:var(--rp);padding:.35rem .85rem;font-size:.82rem;cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(20,34,56,.12)}
.ai-dot{width:8px;height:8px;border-radius:50%;background:var(--warn)} .ai-dot.on{background:#3fcf8e;box-shadow:0 0 0 4px rgba(63,207,142,.18)}
.projects{max-width:1200px;margin:0 auto;padding-block:2rem 4rem}
.projects h1{font-size:clamp(1.8rem,3vw,2.6rem);letter-spacing:-.02em}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.25rem;margin-top:1.5rem}
.pcard{border-radius:var(--rc);border:1px solid var(--hair);background:var(--surface);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:start;padding:0;transition:box-shadow .3s,transform .3s;text-decoration:none}
.pcard:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.thumb{height:190px;overflow:hidden;position:relative;background:var(--bg-2);border-bottom:1px solid var(--hair)}
.thumb .scale{position:absolute;inset:0 auto auto 0;width:400%;transform:scale(.25);transform-origin:0 0;pointer-events:none}
.pcard .meta{padding:.9rem 1rem;display:flex;flex-direction:column;gap:.2rem}
.newcard{border:1.5px dashed var(--ghost);background:transparent;display:grid;place-items:center;min-height:262px;color:var(--muted);font-weight:500}
.studio{display:grid;grid-template-columns:380px minmax(0,1fr);height:calc(100vh - 57px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:560px}
.chatcol{border-inline-end:1px solid var(--hair);display:flex;flex-direction:column;min-height:0;background:var(--panel)}
.chatlog{flex:1;overflow:auto;padding:1rem;display:flex;flex-direction:column;gap:.8rem}
.m{max-width:92%;font-size:.92rem;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.m.u{align-self:flex-end;background:var(--navy);color:#fff;border-radius:1.1rem 1.1rem .3rem 1.1rem;padding:.6rem .9rem}
.m.a{align-self:flex-start;display:flex;flex-direction:column;gap:.5rem}
.m.a .who{display:flex;align-items:center;gap:.45rem;font-size:.78rem;color:var(--muted)} .m.a .who svg{width:18px;height:18px}
.plan-steps{display:flex;flex-direction:column;gap:.35rem;border:1px solid var(--hair);background:var(--surface);border-radius:1rem;padding:.75rem .85rem;font-size:.85rem}
.ps{display:flex;align-items:center;gap:.55rem;color:var(--muted)} .ps.done{color:var(--ink)}
.ps i{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--ghost);flex:none;display:grid;place-items:center}
.ps.done i{background:var(--good);border-color:var(--good)}
.ps.done i::after{content:"";width:6px;height:3px;border:solid #fff;border-width:0 0 1.5px 1.5px;transform:rotate(-45deg) translate(1px,-1px)}
.ps.run i{border-color:var(--blue);border-top-color:transparent;animation:rot .9s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.vchip{align-self:flex-start;display:inline-flex;gap:.5rem;align-items:center;border:1px solid var(--hair);border-radius:.8rem;padding:.35rem .6rem;font-size:.78rem;background:var(--surface)}
.composer{padding:.75rem;border-top:1px solid var(--hair);display:flex;flex-direction:column;gap:.5rem;background:var(--panel)}
.composer .box{border:1px solid var(--hair);border-radius:1.1rem;background:var(--surface);padding:.5rem .55rem .45rem;display:flex;flex-direction:column;gap:.35rem}
.composer textarea{border:0;background:transparent;min-height:3.2rem;max-height:9rem;padding:.25rem .3rem;resize:none}
.composer textarea:focus{outline:none}
.composer .row{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.composer .iconbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--hair);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-2)}
.composer .iconbtn:hover{background:var(--bg-2);color:var(--ink)} .composer .iconbtn svg{width:17px;height:17px}
.atts{display:flex;flex-wrap:wrap;gap:.4rem} .atts:empty{display:none}
.att{position:relative;display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--hair);background:var(--panel);border-radius:.7rem;padding:.25rem .3rem .25rem .25rem;font-size:.75rem;max-width:12rem}
.att img{width:38px;height:38px;object-fit:cover;border-radius:.45rem;display:block}
.att .fi{width:38px;height:38px;border-radius:.45rem;background:var(--bg-2);display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:.62rem;color:var(--ink-2);text-transform:uppercase}
.att span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att button{border:0;background:transparent;cursor:pointer;padding:.15rem;color:var(--muted);display:inline-flex} .att button svg{width:14px;height:14px}
.att button:hover{color:var(--bad)}
.chatcol.drag{outline:2px dashed var(--accent);outline-offset:-8px}
.attnote{font-size:.75rem;color:var(--warn)} .attnote:empty{display:none}
.mfiles{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.45rem}
.mfiles img{width:64px;height:64px;object-fit:cover;border-radius:.6rem;display:block;border:1px solid rgba(255,255,255,.25)}
.mfiles .fchip{display:inline-flex;gap:.3rem;align-items:center;border-radius:.6rem;padding:.25rem .5rem;background:rgba(255,255,255,.14);font-size:.75rem}
.site img.art{width:100%;height:100%;object-fit:cover;display:block;background:none}
.site .gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.6rem;margin-top:1.2rem}
.site .gal .frm{position:relative;aspect-ratio:4/5} .site .gal .frm .art{position:absolute;inset:0}
.composer .send{width:34px;height:34px;background:var(--navy);color:#fff}
.composer .send svg{width:17px;height:17px}
.sugg{display:flex;gap:.35rem;overflow-x:auto;padding-bottom:2px}
.sugg button{flex:none;border:1px solid var(--hair);background:var(--surface);border-radius:var(--rp);padding:.3rem .7rem;font-size:.75rem;cursor:pointer;color:var(--ink-2)}
.viewcol{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg-2)}
.vtools{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;padding:.55rem .75rem;border-bottom:1px solid var(--hair);background:var(--bg)}
.urlbar{flex:1;min-width:160px;display:flex;align-items:center;gap:.4rem;border:1px solid var(--hair);border-radius:var(--rp);padding:.3rem .8rem;font-family:var(--mono);font-size:.78rem;color:var(--muted);background:var(--surface);overflow:hidden;white-space:nowrap}
.urlbar svg{width:12px;height:12px;flex:none}
.stage{flex:1;overflow:auto;padding:1rem;display:flex;justify-content:center;align-items:flex-start}
.frame{width:100%;max-width:1100px;border-radius:14px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--hair);transition:max-width .35s}
.frame.tablet{max-width:780px} .frame.mobile{max-width:390px;border-radius:30px;border:9px solid #101826}
.dash{flex:1;display:grid;grid-template-columns:220px minmax(0,1fr);min-height:0}
.side{border-inline-end:1px solid var(--hair);background:var(--bg);overflow:auto;padding:.6rem;display:flex;flex-direction:column;gap:2px}
.side .g{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:.8rem .6rem .3rem}
.side button{display:flex;align-items:center;gap:.6rem;border:0;background:transparent;border-radius:.7rem;padding:.5rem .6rem;font-size:.86rem;color:var(--ink-2);cursor:pointer;text-align:start}
.side button svg{width:17px;height:17px;flex:none}
.side button:hover{background:var(--bg-2)} .side button[aria-current="true"]{background:var(--bg-2);color:var(--ink);font-weight:500}
.side .lk{margin-inline-start:auto;font-size:.65rem;color:var(--muted)}
.dpane{overflow:auto;padding:1.25rem;min-width:0}
.dpane .inner{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:1rem}
.dh h2{font-size:1.5rem;letter-spacing:-.01em} .dh p{color:var(--muted);margin-top:.3rem;max-width:66ch;font-size:.92rem}
.card{background:var(--surface);border:1px solid var(--hair);border-radius:1.1rem;padding:1rem;min-width:0}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.75rem}
.st{display:flex;flex-direction:column;gap:.6rem}
.rw{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.ct{font-weight:500}
.kpi b{display:block;font-size:1.5rem;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi span{font-size:.78rem;color:var(--muted)}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:.88rem}
table.t th,table.t td{padding:.55rem .6rem;border-bottom:1px solid var(--hair);text-align:start;vertical-align:top}
table.t th{font-size:.7rem;color:var(--muted);font-weight:500;letter-spacing:.07em;text-transform:uppercase}
.num{text-align:end!important;font-variant-numeric:tabular-nums}
.kan{display:grid;grid-template-columns:repeat(4,minmax(170px,1fr));gap:.75rem;overflow-x:auto}
.kcol{background:var(--bg-2);border-radius:1rem;padding:.7rem;display:flex;flex-direction:column;gap:.5rem;min-width:0}
.lead{background:var(--surface);border:1px solid var(--hair);border-radius:.8rem;padding:.6rem .7rem;font-size:.84rem}
.cal{display:grid;grid-template-columns:repeat(7,minmax(96px,1fr));gap:.5rem;overflow-x:auto}
.day{background:var(--bg-2);border-radius:.8rem;padding:.55rem;min-height:128px;display:flex;flex-direction:column;gap:.35rem;font-size:.78rem}
.day h4{font-size:.75rem;color:var(--muted);font-weight:500}
.ap{background:var(--surface);border-inline-start:3px solid var(--blue);border-radius:.5rem;padding:.3rem .45rem}
.tg{display:flex;gap:.7rem;padding:.7rem 0;border-bottom:1px solid var(--hair);align-items:flex-start} .tg:last-child{border-bottom:0}
.tg input{width:18px;height:18px;margin-top:3px;accent-color:var(--blue)}
.ck{display:flex;gap:.55rem;font-size:.88rem;padding:.45rem 0;border-bottom:1px solid var(--hair)} .ck:last-child{border-bottom:0}
.dot{width:9px;height:9px;border-radius:50%;margin-top:.45rem;flex:none}
.dot.ok{background:var(--good)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
pre.code{background:var(--bg-2);border-radius:.8rem;padding:.8rem;overflow-x:auto;font-family:var(--mono);font-size:.75rem;margin:0}
.cm{max-height:360px;overflow:auto;display:flex;flex-direction:column;gap:.5rem}
.cm .mm{max-width:85%;padding:.5rem .8rem;border-radius:1rem;white-space:pre-wrap;font-size:.88rem}
.cm .mm.me{align-self:flex-end;background:var(--navy);color:#fff} .cm .mm.ai{align-self:flex-start;background:var(--bg-2)}
.lockbox{border:1.5px dashed var(--ghost);border-radius:1.25rem;padding:2rem;text-align:center;display:flex;flex-direction:column;align-items:center;gap:.75rem}
.chart{width:100%;height:auto;display:block}
.pipe{display:flex;flex-direction:column;gap:.4rem}
.dns td{font-family:var(--mono);font-size:.8rem}
.copy{border:1px solid var(--hair);background:var(--bg-2);border-radius:.5rem;padding:.15rem .5rem;font-size:.72rem;cursor:pointer}
/* ad creatives */
.adrow{display:flex;flex-wrap:wrap;gap:1rem;align-items:flex-start}
.ad{position:relative;overflow:hidden;border-radius:14px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:1.1rem;box-shadow:var(--shadow);font-family:var(--f);isolation:isolate}
.ad.sq{width:240px;aspect-ratio:1/1} .ad.pt{width:220px;aspect-ratio:4/5} .ad.st{width:170px;aspect-ratio:9/16}
.ad .bgart{position:absolute;inset:0;z-index:-1}
.ad .brand{font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;opacity:.85}
.ad .hl{font-family:"Fraunces",Georgia,serif;font-weight:600;line-height:1.02;letter-spacing:-.01em}
.ad.sq .hl{font-size:1.65rem} .ad.pt .hl{font-size:1.6rem} .ad.st .hl{font-size:1.45rem}
.ad .sub{font-size:.75rem;opacity:.9}
.ad .cta{align-self:flex-start;background:#fff;color:#141414;border-radius:999px;padding:.4rem .85rem;font-size:.72rem;font-weight:600}
.ad.vid .bgart{animation:kb 6s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.12) translate(-3%,-2%)}}
.ad .play{position:absolute;top:.7rem;inset-inline-end:.7rem;font-size:.62rem;background:rgba(0,0,0,.45);padding:.15rem .45rem;border-radius:999px}

/* ---------- Generated client sites (templates, by kind of business) ---------- */
.app{--s-bg:#fbfaf7;--s-fg:#1f1b16;--s-mu:#6b6257;--s-ac:#8a4f2b;--s-soft:#f1ebe2;--s-on:#fff;--s-art1:#c9a27e;--s-art2:#5b3a29}
.site{--s-bg:#fbfaf7;--s-fg:#1f1b16;--s-mu:#6b6257;--s-ac:#8a4f2b;--s-soft:#f1ebe2;--s-on:#fff;--s-art1:#c9a27e;--s-art2:#5b3a29;
  --s-disp:"Fraunces",Georgia,serif;background:var(--s-bg);color:var(--s-fg);font-size:15px;font-family:var(--f)}
:is(.site,.app)[data-s="salon"]{--s-bg:#fbf7f4;--s-fg:#2a1d1a;--s-mu:#73605a;--s-ac:#a6513f;--s-soft:#f3e7e1;--s-on:#fff;--s-art1:#e6b8a6;--s-art2:#6e3b31}
:is(.site,.app)[data-s="garage"]{--s-bg:#141618;--s-fg:#eef0f2;--s-mu:#a2a8af;--s-ac:#f0a43a;--s-soft:#1e2125;--s-on:#141618;--s-art1:#3a4047;--s-art2:#0c0d0f;--s-disp:"Onest",sans-serif}
:is(.site,.app)[data-s="clinic"]{--s-bg:#f7fbfb;--s-fg:#10282b;--s-mu:#54706f;--s-ac:#137a74;--s-soft:#e3f1ef;--s-on:#fff;--s-art1:#9fd2ca;--s-art2:#1f4f4c;--s-disp:"Onest",sans-serif}
:is(.site,.app)[data-s="restaurant"]{--s-bg:#fbf6ec;--s-fg:#2b1d12;--s-mu:#7a6551;--s-ac:#b8412b;--s-soft:#f2e7d3;--s-on:#fff;--s-art1:#e1a35a;--s-art2:#6d2a1d}
:is(.site,.app)[data-s="realestate"]{--s-bg:#f6f5f2;--s-fg:#191a1c;--s-mu:#5f6166;--s-ac:#1d3b5c;--s-soft:#ebe9e4;--s-on:#fff;--s-art1:#b9b3a6;--s-art2:#2e3640;--s-disp:"Onest",sans-serif}
:is(.site,.app)[data-s="coach"]{--s-bg:#f5f7f0;--s-fg:#1b2116;--s-mu:#5d6853;--s-ac:#4b7a1f;--s-soft:#e6ecdb;--s-on:#fff;--s-art1:#b7cf8f;--s-art2:#2d3d1f;--s-disp:"Onest",sans-serif}
:is(.site,.app)[data-s="cleaning"]{--s-bg:#f6fafc;--s-fg:#122434;--s-mu:#557083;--s-ac:#1f6f9f;--s-soft:#e2eef5;--s-on:#fff;--s-art1:#a9d1e6;--s-art2:#173c57;--s-disp:"Onest",sans-serif}
:is(.site,.app)[data-s="night"]{--s-bg:#111317;--s-fg:#f1efe9;--s-mu:#a7a49b;--s-ac:#d8b26a;--s-soft:#1b1e23;--s-on:#111317;--s-art1:#3c3a35;--s-art2:#0a0b0d}
.site .sn{display:flex;justify-content:space-between;align-items:center;gap:.75rem;padding:1rem 1.6rem}
.site .sn b{font-family:var(--s-disp);font-size:1.15rem;font-weight:600;letter-spacing:-.01em}
.site .sn nav{display:flex;gap:1.1rem;font-size:.82rem;color:var(--s-mu)}
.site .sbtn{display:inline-flex;align-items:center;gap:.4rem;background:var(--s-ac);color:var(--s-on);border-radius:999px;padding:.7rem 1.3rem;font-weight:600;border:0;cursor:pointer;font-size:.9rem;transition:transform .15s,filter .2s}
.site .sbtn:hover{filter:brightness(1.08);transform:translateY(-1px)} .site .sbtn:active{transform:translateY(1px)}
.site .sbtn.line{background:transparent;color:var(--s-fg);border:1px solid color-mix(in srgb,var(--s-fg) 25%,transparent)}
.site .art{position:relative;overflow:hidden;background:radial-gradient(120% 90% at 20% 15%,var(--s-art1),transparent 60%),radial-gradient(90% 80% at 85% 90%,color-mix(in srgb,var(--s-ac) 70%,var(--s-art2)),transparent 65%),linear-gradient(160deg,var(--s-art1),var(--s-art2));transition:transform .5s}
.site .art::after{content:"";position:absolute;inset:0;opacity:.35;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='.55'/></svg>")}
.site .frm{overflow:hidden;border-radius:0}
.site .frm:hover .art{transform:scale(1.025)}
.site .enter{animation:up .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.site .kick{font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;color:var(--s-mu)}
.site h2.h1{font-family:var(--s-disp);font-weight:600;letter-spacing:-.025em;line-height:1}
.site h3{font-family:var(--s-disp);font-size:clamp(1.5rem,2.6vw,2.1rem);font-weight:600;letter-spacing:-.015em}
.site p{color:var(--s-mu);max-width:58ch}
.site .facts{display:flex;flex-wrap:wrap;gap:1.4rem;font-size:.85rem}
.site .facts b{display:block;font-size:1.05rem;color:var(--s-fg);font-weight:600;font-variant-numeric:tabular-nums}
.site .facts span{color:var(--s-mu)}
.site .sec{padding:4rem 1.6rem;display:flex;flex-direction:column;gap:1.6rem}
.site .sec.soft{background:var(--s-soft)}
/* place hero: full bleed frame, name set large */
.site .hero-place{position:relative;min-height:520px;display:flex;align-items:flex-end;color:#fff}
.site .hero-place .frm{position:absolute;inset:0}
.site .hero-place .frm .art{position:absolute;inset:0}
.site .hero-place .veil{position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(0,0,0,.55))}
.site .hero-place .cap{position:relative;padding:2.2rem 1.6rem;display:flex;flex-direction:column;gap:1rem;width:100%}
.site .hero-place h2.h1{font-size:clamp(2.4rem,6.4vw,4.6rem);max-width:13ch;color:#fff}
.site .hero-place p{color:rgba(255,255,255,.88)}
.site .hero-place .facts b{color:#fff} .site .hero-place .facts span{color:rgba(255,255,255,.75)}
.site .hero-place .kick{color:rgba(255,255,255,.75)}
/* service hero: split, type left, frame right */
.site .hero-split{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);min-height:500px}
.site .hero-split .txt{padding:3.4rem 1.6rem;display:flex;flex-direction:column;gap:1.1rem;justify-content:center}
.site .hero-split h2.h1{font-size:clamp(2.2rem,5vw,3.8rem);max-width:14ch}
.site .hero-split .frm .art{position:absolute;inset:0}
.site .hero-split .frm{position:relative;min-height:320px}
/* offer: menu rows (place) or cards (service) */
.site .menu{display:flex;flex-direction:column}
.site .menu .row{display:flex;align-items:baseline;gap:.8rem;padding:1rem 0;border-bottom:1px solid color-mix(in srgb,var(--s-fg) 12%,transparent)}
.site .menu .row b{font-weight:600;font-size:1.05rem}
.site .menu .row i{flex:1;border-bottom:1px dotted color-mix(in srgb,var(--s-fg) 30%,transparent);transform:translateY(-4px)}
.site .menu .row span{font-variant-numeric:tabular-nums;color:var(--s-fg);font-weight:600}
.site .menu .row small{display:block;color:var(--s-mu);font-size:.8rem;font-weight:400}
.site .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:1rem}
.site .cardx{background:var(--s-bg);border:1px solid color-mix(in srgb,var(--s-fg) 10%,transparent);border-radius:1rem;padding:1.2rem;display:flex;flex-direction:column;gap:.45rem;transition:transform .25s,box-shadow .25s}
.site .cardx:hover{transform:translateY(-2px);box-shadow:0 18px 40px -24px rgba(0,0,0,.35)}
.site .cardx b{font-size:1.05rem;font-weight:600} .site .cardx .p{color:var(--s-ac);font-weight:600;font-variant-numeric:tabular-nums}
.site .duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}
.site .duo .frm{position:relative;aspect-ratio:1/1;max-width:100%} .site .duo .frm .art{position:absolute;inset:0}
.site .duo .frm:nth-child(2) .art{background:radial-gradient(100% 80% at 80% 20%,var(--s-art1),transparent 60%),linear-gradient(200deg,color-mix(in srgb,var(--s-ac) 55%,var(--s-art2)),var(--s-art2))}
.site .big-type{font-family:var(--s-disp);font-weight:600;font-size:clamp(2.6rem,8vw,6rem);letter-spacing:-.03em;line-height:.95;color:var(--s-fg)}
.site .split2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:2rem;align-items:start}
.site details{border-bottom:1px solid color-mix(in srgb,var(--s-fg) 12%,transparent);padding:.9rem 0}
.site summary{cursor:pointer;font-weight:600}
.site .quote{border-inline-start:3px solid var(--s-ac);padding-inline-start:1rem;display:flex;flex-direction:column;gap:.4rem}
.site .sf{display:grid;gap:.6rem;max-width:460px}
.site .sf input,.site .sf select{background:var(--s-bg);color:var(--s-fg);border:1px solid color-mix(in srgb,var(--s-fg) 18%,transparent);border-radius:.8rem}
.site footer{padding:1.4rem 1.6rem;font-size:.78rem;color:var(--s-mu);border-top:1px solid color-mix(in srgb,var(--s-fg) 10%,transparent);display:flex;flex-wrap:wrap;gap:.5rem 1.2rem;justify-content:space-between}
.site .actionbar{position:sticky;bottom:0;display:none;gap:.5rem;padding:.6rem;background:color-mix(in srgb,var(--s-bg) 92%,transparent);backdrop-filter:blur(8px);border-top:1px solid color-mix(in srgb,var(--s-fg) 10%,transparent)}
.site .actionbar .sbtn{flex:1;justify-content:center}
.site .tabbar{display:flex;justify-content:space-around;border-top:1px solid color-mix(in srgb,var(--s-fg) 10%,transparent);padding:.6rem 0;font-size:.7rem;color:var(--s-mu);position:sticky;bottom:0;background:var(--s-bg)}
.frame.mobile .site .hero-split,.frame.mobile .site .split2,.frame.mobile .site .duo{grid-template-columns:minmax(0,1fr)}
.frame.mobile .site .hero-place{min-height:460px}
.frame.mobile .site .actionbar{display:flex}
.frame.mobile .site .sn nav{display:none}


/* ---------- Generated client app (native-style, deliberately different from the site) ---------- */
.app{display:flex;flex-direction:column;height:min(780px,82vh);font-family:var(--f);color:var(--s-fg);background:color-mix(in srgb,var(--s-soft) 60%,var(--s-bg));position:relative}
.app .a-status{display:flex;justify-content:space-between;padding:.55rem 1.3rem .2rem;font-size:.72rem;font-weight:600;font-variant-numeric:tabular-nums}
.app .a-head{display:flex;align-items:center;justify-content:space-between;gap:.8rem;padding:.6rem 1.15rem .9rem}
.app .a-head small{display:block;color:var(--s-mu);font-size:.78rem}
.app .a-head b{font-size:1.45rem;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.app .a-av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:var(--s-on);background:linear-gradient(135deg,var(--s-ac),var(--s-art2));flex:none}
.app .a-body{flex:1;overflow:auto;padding:0 1rem 1.2rem;display:flex;flex-direction:column;gap:1.05rem}
.app .a-body>*{flex-shrink:0}
.app .a-hero{border-radius:24px;padding:1.1rem 1.15rem;color:#fff;display:flex;flex-direction:column;gap:.55rem;position:relative;overflow:hidden;background:radial-gradient(90% 120% at 100% 0%,color-mix(in srgb,var(--s-art1) 70%,transparent),transparent 60%),linear-gradient(135deg,var(--s-ac),var(--s-art2))}
.app .a-hero small{opacity:.85;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase}
.app .a-hero .big{font-size:1.65rem;font-weight:700;letter-spacing:-.02em;line-height:1.05}
.app .a-btn{align-self:flex-start;border:0;border-radius:999px;padding:.6rem 1.05rem;font-weight:600;font-size:.85rem;cursor:pointer;background:#fff;color:#111;transition:transform .15s}
.app .a-btn:active{transform:scale(.97)}
.app .a-btn:disabled{opacity:.45;cursor:not-allowed}
.app .a-btn.solid{background:var(--s-ac);color:var(--s-on)}
.app .a-quick{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem}
.app .a-quick button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:.35rem;font-size:.7rem;color:var(--s-fg);cursor:pointer}
.app .a-quick span.i{width:50px;height:50px;border-radius:17px;display:grid;place-items:center;background:var(--s-bg);box-shadow:0 6px 16px -10px rgba(0,0,0,.35);color:var(--s-ac);transition:transform .15s}
.app .a-quick button:hover span.i{transform:translateY(-2px)}
.app .a-quick svg{width:22px;height:22px}
.app .a-t{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:1rem}
.app .a-t span{font-weight:500;font-size:.78rem;color:var(--s-ac)}
.app .a-h{display:flex;gap:.65rem;overflow-x:auto;padding-bottom:.3rem;scrollbar-width:none}
.app .a-svc{flex:none;width:148px;border-radius:20px;background:var(--s-bg);padding:.8rem;display:flex;flex-direction:column;gap:.3rem;box-shadow:0 10px 24px -18px rgba(0,0,0,.45);border:0;text-align:start;cursor:pointer;color:var(--s-fg);transition:transform .2s}
.app .a-svc:hover{transform:translateY(-2px)}
.app .a-svc .sw{height:64px;border-radius:14px;background:linear-gradient(135deg,var(--s-art1),color-mix(in srgb,var(--s-ac) 60%,var(--s-art2)))}
.app .a-svc b{font-size:.85rem;font-weight:600;line-height:1.2}
.app .a-svc .pr{font-size:.78rem;color:var(--s-ac);font-weight:600;font-variant-numeric:tabular-nums}
.app .a-card{background:var(--s-bg);border-radius:20px;padding:.95rem;display:flex;flex-direction:column;gap:.6rem;box-shadow:0 10px 24px -20px rgba(0,0,0,.45)}
.app .stamps{display:grid;grid-template-columns:repeat(8,1fr);gap:.3rem}
.app .stamps i{aspect-ratio:1;border-radius:50%;border:1.5px dashed color-mix(in srgb,var(--s-fg) 25%,transparent)}
.app .stamps i.on{border:0;background:var(--s-ac)}
.app .opts{display:flex;flex-direction:column;gap:.5rem}
.app .opt-r{display:flex;align-items:center;justify-content:space-between;gap:.6rem;border-radius:16px;padding:.8rem .9rem;background:var(--s-bg);border:1.5px solid transparent;cursor:pointer;text-align:start;color:var(--s-fg);font-size:.88rem}
.app .opt-r[aria-pressed="true"]{border-color:var(--s-ac)}
.app .opt-r small{display:block;color:var(--s-mu);font-size:.75rem}
.app .chips-h{display:flex;gap:.45rem;overflow-x:auto;scrollbar-width:none}
.app .dchip{flex:none;width:56px;border-radius:16px;padding:.55rem 0;display:flex;flex-direction:column;align-items:center;gap:.1rem;background:var(--s-bg);border:1.5px solid transparent;cursor:pointer;color:var(--s-fg);font-size:.68rem}
.app .dchip b{font-size:1.05rem;font-variant-numeric:tabular-nums}
.app .dchip[aria-pressed="true"]{background:var(--s-ac);color:var(--s-on)}

function load(){try{const s=localStorage.getItem(KEY);if(s){S=JSON.parse(s);if(S?.projects?.length)return}}catch{} S=freshState();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch{}}
const P=()=>S.projects.find(p=>p.id===S.current)||S.projects[0];
let UI={att:[],tab:"preview",mod:"booking",device:"desktop",busy:false,adFmt:"all",app:{tab:"home",svc:null,day:0,time:null,done:null}};

/* ======================= quota ======================= */
const quota=()=>PLAN[S.plan].q+(S.usage.rolled||0)+(S.usage.bonus||0);
const usedToday=()=>S.usage.day===today()?(S.usage.dayUsed||0):0;
const resetDate=()=>{const d=new Date(S.usage.period+"T12:00:00");d.setMonth(d.getMonth()+1);return d.toLocaleDateString("fr-FR",{day:"numeric",month:"long"})};
const left=()=>{const l=Math.max(0,quota()-S.usage.used);return S.plan==="free"?Math.min(l,Math.max(0,FREE_DAILY-usedToday())):l};
function spend(n=1){if(left()<n)return false;S.usage.used+=n;S.usage.dayUsed=usedToday()+n;S.usage.day=today();save();return true}
function refund(n=1){S.usage.used=Math.max(0,S.usage.used-n);S.usage.dayUsed=Math.max(0,usedToday()-n);save()}
const cr=(n)=>n===1?"1 crédit":`${n} crédits`;
function meterHTML(){const q=quota(),u=Math.min(S.usage.used,q),pct=Math.round(u/q*100);return `<span class="meter ${pct>=100?"full":pct>=80?"warn":""}" title="Crédits IA ce mois"><span class="bar"><i style="width:${pct}%"></i></span>${u}/${q} crédits</span>`}
function bannerHTML(){const q=quota(),pct=S.usage.used/q*100;
  if(pct>=100||left()<=0)return `<div class="banner full" role="status"><b>${S.plan==="free"&&usedToday()>=FREE_DAILY&&S.usage.used<quota()?"Limite du jour atteinte.":"Crédits IA épuisés."}</b> Votre site, vos réservations et vos paiements continuent de fonctionner. ${S.plan==="free"&&usedToday()>=FREE_DAILY&&S.usage.used<quota()?`L'offre Gratuit permet ${FREE_DAILY} crédits par jour : reprise demain,`:`Les actions de l'IA reprennent le ${resetDate()},`} ou tout de suite avec :<button class="btn sm" type="button" data-pack>Pack ${PACK.n} crédits · ${PACK.p} ₪</button><button class="btn sm dark" type="button" data-upsell>Passer à l'abonnement supérieur</button></div>`;
  if(pct>=80)return `<div class="banner warn" role="status">Vous avez utilisé ${Math.round(pct)} % de vos crédits IA du mois (renouvellement le ${resetDate()}).<button class="btn sm" type="button" data-pack>Ajouter ${PACK.n} · ${PACK.p} ₪</button></div>`;
  return "";}
function wireQuota(root){root.querySelectorAll("[data-pack]").forEach(b=>b.onclick=()=>{S.usage.bonus=(S.usage.bonus||0)+PACK.n;S.receipts.unshift({at:today(),what:`Pack ${PACK.n} crédits IA`,amount:PACK.p});save();render()});
  root.querySelectorAll("[data-upsell]").forEach(b=>b.onclick=()=>{const n=PLANS[Math.min(3,rank(S.plan)+1)];S.plan=n;save();render()});}

const COPY_RULES=`Copy rules (house style): the main title names the trade and the city or district (e.g. "Kiné à Jérusalem, quartier Rehavia"); the subtitle carries one hard fact (a price from, opening days or a duration); buttons are a verb and an object ("Réserver un créneau"); plain words, no superlatives, no "passion", "unique", "excellence", "découvrez", no exclamation marks; address = street or district only, never a house number; never invent phone numbers, emails, prices, reviews or figures.`;

const KIND={salon:/coiff|salon|hair|barb|ongl|manucur|esth|beaut|מספר|שיער|ציפורנ|парикмах|красот/i,garage:/garage|méca|meca|auto|voiture|car |מוסך|авто/i,clinic:/clini|cabinet|médec|medec|dent|santé|kiné|kine|ostéo|doctor|מרפא|רופא|клиник|врач/i,cleaning:/nettoy|ménage|menage|clean|ניקי|уборк/i,restaurant:/restau|café|cafe|traiteur|pizza|boulang|food|מסעד|ресторан|кафе/i,realestate:/immo|agence|real estate|נדל|недвиж/i,coach:/coach|sport|yoga|pilates|fitness|אימון|тренер/i};
const OFF={salon:["Coupe","Couleur","Brushing","Soin"],garage:["Révision","Diagnostic","Freins","Préparation au test"],clinic:["Première consultation","Séance de suivi","Bilan","Rééducation"],cleaning:["Ménage régulier","Grand nettoyage","Fin de chantier","Bureaux"],restaurant:["Menu du midi","À emporter","Livraison","Événements privés"],realestate:["Vente","Location","Estimation","Gestion locative"],coach:["Séance individuelle","Cours collectif","Programme 8 semaines","Séance découverte"],other:["Prestation 1","Prestation 2","Prestation 3"]};
const TRADE_FR={salon:"Salon",garage:"Garage",clinic:"Cabinet",cleaning:"Nettoyage",restaurant:"Restaurant",realestate:"Agence immobilière",coach:"Coach",other:"Entreprise"};
const CITIES=["Tel Aviv","Jérusalem","Haïfa","Netanya","Ashdod","Ashkelon","Raanana","Herzliya","Rishon","Petah Tikva","Beer Sheva","Eilat","Ramat Gan","Holon","Bat Yam","Kfar Saba","Modiin","Hadera"];
function themeFor(kind){return THEMES.includes(kind)?kind:"realestate"}
function offlineGenerate(desc,lang){
  const kind=Object.keys(KIND).find(k=>KIND[k].test(desc))||"other";
  const quoted=(desc.match(/«\s*([^»]{2,60}?)\s*»|"([^"]{2,60})"/)||[]).slice(1).find(Boolean);
  const first=(desc.split(/[,.\n]/)[0]||"").trim();
  const city=CITIES.find(c=>desc.toLowerCase().includes(c.toLowerCase()))||"";
  const name=clip(quoted||(first&&first.length<=40&&!/^(je|j'|j’|nous|i |we |אני|я )/i.test(first)?first:`${TRADE_FR[kind]}${city?" "+city:""}`),60);
  const prices=[...desc.matchAll(/([A-Za-zÀ-ÿ֐-׿' ]{3,30}?)\s*(?::|à|-)?\s*(\d{2,5})\s*(?:₪|shekels?|nis|ils)/gi)].slice(0,6).map(m=>({name:clip(m[1].replace(/^(et|,|\s)+/i,"").replace(/^\w/,c=>c.toUpperCase()),40),price:m[2]+" ₪",duration:60,desc:""})).filter(s=>s.name.length>2);
  const svcs=prices.length?prices:OFF[kind].map(n=>({name:n,price:"",duration:60,desc:""}));
  const mp=minPrice(svcs);
  return {biz:{name,industry:kind,city,district:"",description:clip(desc,400),lang,services:svcs},
    site:{theme:themeFor(kind),heroTitle:`${TRADE_FR[kind]}${city?" à "+city:""}`,heroSubtitle:mp?`${svcs.slice(0,3).map(s=>s.name).join(", ")}. Dès ${mp} ₪, réservation en ligne.`:clip(desc,170),about:clip(desc,400),
      faq:[{q:"Comment prendre rendez-vous ?",a:"En ligne en une minute, ou par téléphone."},{q:"Quels moyens de paiement acceptez-vous ?",a:"Carte bancaire, Bit et espèces."}]},keywords:[]};
}
function offlineEdit(site,instr){
  const s=structuredClone(site),t=instr.toLowerCase();
  if(/(enl[eè]v|retir|supprim|remove)\w*\s+(les|mes|ces|toutes les)\s+(photos|images)/.test(t)&&s.photos&&Object.keys(s.photos).length){s.photos={};return{site:s,summary:"C'est fait : vos photos ont été retirées du site (elles restent dans la conversation)."}}
  const TW=[["night",/sombre|fonc|noir|dark|nuit|כהה|тёмн|темн/],["cleaning",/bleu|blue|כחול|син/],["coach",/vert|olive|green|ירוק|зел/],["restaurant",/terracotta|rouge|chaud|warm|אדום/],["realestate",/sobre|minimal|pierre|gris|אפור/],["salon",/rose|doux|clair|light|בהיר/]];
  const SW=[["faq",/faq|question/],["gallery",/galerie|photo|gallery|image|גלריה/],["testimonials",/avis|review|témoign|temoign|המלצ/],["services",/service|prestation/],["booking",/réserv|reserv|rendez|booking|תור/],["about",/propos|about|maison|עלינו/]];
  if(/supprim|enl[eè]v|retir|remove|הסר|מחק/.test(t)){const f=SW.find(([,r])=>r.test(t));if(f&&s.sections.includes(f[0])){s.sections=s.sections.filter(x=>x!==f[0]);return{site:s,summary:"C'est fait : la section a été retirée."}}}
  if(/ajout|add|הוס/.test(t)){const f=SW.find(([,r])=>r.test(t));if(f&&!s.sections.includes(f[0])){s.sections.splice(Math.max(1,s.sections.indexOf("contact")),0,f[0]);if(f[0]==="testimonials"&&!s.testimonials.length)s.testimonials=[{name:"Exemple (à remplacer)",text:"Remplacez ce texte par un vrai avis client avant de publier.",ex:true}];return{site:s,summary:"C'est fait : la section a été ajoutée."}}}
  if(/titre|title|כותרת/.test(t)){const m=instr.match(/[«"“]([^»"”]{2,80})[»"”]/)||instr.match(/:\s*(.{2,80})$/);if(m){s.heroTitle=clip(m[1],80);return{site:s,summary:"C'est fait : nouveau titre principal."}}}
  const th=TW.find(([,r])=>r.test(t));
  if(th||/couleur|th[eè]me|color|style|צבע/.test(t)){s.theme=th?th[0]:THEMES[(THEMES.indexOf(s.theme)+1)%THEMES.length];return{site:s,summary:`C'est fait : palette « ${THEME_NAMES[s.theme]} ».`}}
  return null;
}

function bookForm(p,l){return `<form class="sf" data-book>

  <button class="sbtn" type="submit">${esc(l.book)}</button><p class="bm" role="status" style="font-size:.85rem"></p></form>`;}
function wireSite(root){
  root.querySelectorAll("[data-scroll-book]").forEach(b=>b.onclick=()=>{const a=b.closest(".site")?.querySelector("[data-book-anchor]");a?.scrollIntoView({behavior:"smooth",block:"center"});});
  root.querySelectorAll("form[data-book]").forEach(f=>f.onsubmit=(ev)=>{ev.preventDefault();const p=P(),l=L[p.biz.lang]||L.fr,d=Object.fromEntries(new FormData(f));
    if(!String(d.name||"").trim()||!String(d.phone||"").trim()){f.querySelector(".bm").textContent=l.req;return}
    book(p,{client:clip(d.name,60),phone:clip(d.phone,20),service:d.service,date:d.date,time:d.time,source:"Site internet"});
    f.reset();f.querySelector(".bm").textContent=l.done+" (démo)";});

function book(p,a){
  p.appointments.push({id:uid(),date:a.date,time:a.time,service:a.service,client:a.client,phone:a.phone});
  if(!p.contacts.some(c=>c.phone===a.phone))p.contacts.push({id:uid(),name:a.client,phone:a.phone,stage:"Nouveau",source:a.source||"Réservation",notes:""});
  if(p.billing.deposit){const sv=p.biz.services.find(s=>s.name===a.service);const n=Number(String(sv?.price||"").replace(/[^\d]/g,""));if(n)p.payments.push({id:uid(),date:today(),amount:Math.round(n*p.billing.depositPct/100),client:a.client,desc:`${a.service} (acompte ${p.billing.depositPct} %)`,status:"en attente",method:"Lien"});}
  if(p.automations.reminder24)p.log.unshift({at:today(),text:`Rappel WhatsApp programmé pour ${a.client}, la veille du ${a.date} à ${a.time} (simulation)`});
  if(p.automations.lead)p.log.unshift({at:today(),text:`Vous êtes prévenu : nouveau rendez-vous « ${a.service} » (simulation)`});
  save();
}

function wireApp(root,p){
  const st=UI.app,re=()=>render();
  root.querySelectorAll("[data-atab]").forEach(b=>b.onclick=()=>{st.tab=b.dataset.atab;if(st.tab==="book")st.done=null;re()});
  root.querySelectorAll("[data-aquick]").forEach(b=>b.onclick=()=>{const k=b.dataset.aquick;
    if(k==="book"){st.tab="book";st.done=null;re()}
    else if(k==="loyal"){st.tab="loyal";re()}
    else $("#topStatus").textContent=k==="call"?(p.biz.phone?`Appel vers ${p.biz.phone} (démo)`:"Ajoutez un numéro dans Site internet."):`Itinéraire vers ${p.biz.address||p.biz.city||"l'adresse"} (démo)`;});
  root.querySelectorAll("[data-asvc]").forEach(b=>b.onclick=()=>{st.svc=Number(b.dataset.asvc);st.tab="book";st.done=null;re()});
  root.querySelectorAll("[data-aday]").forEach(b=>b.onclick=()=>{st.day=Number(b.dataset.aday);st.time=null;re()});
  root.querySelectorAll("[data-atime]").forEach(b=>b.onclick=()=>{st.time=b.dataset.atime;re()});
  root.querySelectorAll("[data-asw]").forEach(b=>b.onclick=()=>{st[b.dataset.asw]=b.getAttribute("aria-pressed")!=="true";re()});
  const c=root.querySelector("[data-aconfirm]");
  if(c)c.onclick=()=>{const svc=p.biz.services[st.svc];if(!svc||!st.time)return;const date=addDays(today(),(st.day||0)+1);
    book(p,{client:"Client de l'application",phone:"app-"+uid(),service:svc.name,date,time:st.time,source:"Application"});
    p.appBookings.push({date,time:st.time,service:svc.name});p.loyalty.stamps=Math.min(p.loyalty.goal,(p.loyalty.stamps||0)+1);
    st.done=`${svc.name} · ${new Date(date+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})} · ${st.time}`;st.svc=null;st.time=null;save();re()};
}

Votre site, vos rendez-vous et vos paiements continuent de fonctionner normalement. Seules les actions de l'IA s'arrêtent jusqu'au renouvellement de votre abonnement.", "Vous pouvez aussi ajouter un pack de crédits, ou passer à l'abonnement supérieur : la différence de crédits est ajoutée tout de suite."]}, {"heading": "L'ordre d'utilisation", "paragraphs": ["IDANATID utilise d'abord les crédits reportés, puis ceux du mois, puis ceux de vos packs. Les crédits des packs ne sont donc entamés que lorsque tout le reste est utilisé."]}, {"heading": "Ce qui n'est pas payé en crédits", "paragraphs": ["L'assistant téléphonique se paie à part, à la minute (49 ₪ par mois puis 1,20 ₪ la minute, avec un plafond que vous choisissez). Les vidéos publicitaires IA se paient à l'unité (39 ₪). Les prix peuvent évoluer : vous êtes prévenu un mois avant tout changement."]}]}, "contact": {"title": "Nous contacter", "description": "Une question sur IDANATID, votre compte ou vos données ? Écrivez-nous.", "intro": "Une question sur IDANATID, un problème avec votre site, une demande sur vos données personnelles ? Écrivez-nous, une vraie personne vous répond.", "emailLabel": "Adresse e-mail", "emailCta": "Écrire un e-mail", "sections": [{"heading": "Délai de réponse", "paragraphs": ["Nous répondons en général sous deux jours ouvrés, en hébreu, en français ou en anglais."]}, {"heading": "Pour aller plus vite", "paragraphs": ["Indiquez l'adresse e-mail de votre compte IDANATID et le nom de votre entreprise. Ne nous envoyez jamais de mot de passe, de numéro de carte bancaire ni de clé d'accès."]}, {"heading": "Données personnelles et sécurité", "paragraphs": ["Pour exercer vos droits sur vos données, ou nous signaler un problème de sécurité, écrivez à la même adresse en précisant « Données personnelles » ou « Sécurité » dans l'objet."]}]}, "legal": {"title": "Mentions légales", "description": "Qui édite IDANATID, qui l'héberge et quelles règles s'appliquent.", "intro": "Ces informations permettent de savoir qui se trouve derrière IDANATID et comment nous joindre.", "sections": [{"heading": "Éditeur", "paragraphs": ["IDANATID est édité par Ichay Sitbon, entrepreneur individuel (עוסק פטור) établi en Israël.", "Contact : idanatidai@idanatid.com", "Responsable de la publication : Ichay Sitbon."]}, {"heading": "Hébergement", "paragraphs": ["L'application est hébergée par Vercel Inc. (États-Unis), vercel.com.", "Les bases de données et les fichiers sont hébergés par Supabase Inc., dans un centre de données situé à Francfort (Allemagne), supabase.com."]}, {"heading": "Intelligence artificielle", "paragraphs": ["Les textes et propositions générés automatiquement sont produits avec les modèles Claude d'Anthropic PBC (États-Unis).", "Un contenu produit par l'IA peut contenir des erreurs. Relisez votre site avant de le publier : vous restez responsable des informations qui y figurent, notamment vos prix, horaires et coordonnées."]}, {"heading": "Propriété intellectuelle", "paragraphs": ["La marque IDANATID, le logiciel et le design de la plateforme appartiennent à leur éditeur. Toute reproduction sans autorisation est interdite.", "Les textes, photos et logos que vous ajoutez restent les vôtres. Vous garantissez avoir le droit de les utiliser."]}, {"heading": "Accessibilité", "paragraphs": ["Nous visons la conformité à la norme israélienne IS 5568, fondée sur les règles internationales WCAG 2.1 niveau AA. Si une page vous pose problème, écrivez-nous : nous corrigerons."]}, {"heading": "Droit applicable", "paragraphs": ["Ces mentions sont régies par le droit israélien. Si vous résidez dans l'Union européenne, vous conservez la protection des règles impératives de votre pays."]}]}, "privacy": {"title": "Politique de confidentialité", "description": "Quelles données IDANATID collecte, pourquoi, avec qui elles sont partagées et quels sont vos droits.", "intro": "Cette politique explique simplement quelles données nous traitons quand vous utilisez IDANATID, pourquoi, et comment vous gardez la main dessus. Elle suit la loi israélienne sur la protection de la vie privée (חוק הגנת הפרטיות, התשמ״א-1981) et, pour les personnes dans l'Union européenne, le RGPD.", "sections": [{"heading": "Responsable du traitement", "paragraphs": ["Ichay Sitbon, éditeur d'IDANATID, Israël. Contact : idanatidai@idanatid.com"]}, {"heading": "Les données que nous collectons", "items": ["Votre compte : adresse e-mail et mot de passe (stocké sous forme chiffrée, nous ne le voyons jamais).", "Votre entreprise : nom, métier, ville, services, prix, horaires, textes et images que vous ajoutez.", "Les données de vos clients que vous enregistrez dans IDANATID (réservations, coordonnées, historique). Pour ces données, vous êtes le responsable et nous agissons pour votre compte.", "Les données techniques nécessaires au service : journaux de connexion, adresse IP, type d'appareil, et le suivi de votre consommation d'IA."]}, {"heading": "Pourquoi nous les utilisons", "items": ["Créer, afficher et faire fonctionner votre site et vos outils.", "Vous connecter en sécurité et protéger la plateforme contre les abus.", "Vous envoyer les e-mails indispensables : confirmation de compte, mot de passe, informations sur le service.", "Respecter nos obligations légales, notamment comptables."], "paragraphs": ["Nous ne vendons jamais vos données et nous ne les utilisons pas pour entraîner des modèles d'IA."]}, {"heading": "Avec qui elles sont partagées", "paragraphs": ["Uniquement avec les prestataires indispensables au service, liés par contrat et tenus à la confidentialité :"], "items": ["Supabase (base de données et comptes, données stockées à Francfort).", "Vercel (hébergement de l'application et des sites).", "Anthropic (modèles d'IA Claude, pour rédiger et modifier vos contenus).", "Plus tard, selon les modules que vous activez : prestataire d'e-mails, de paiement, de téléphonie ou de reçus. Cette liste sera mise à jour avant chaque ajout."]}, {"heading": "Transferts hors d'Israël", "paragraphs": ["Certains prestataires sont situés aux États-Unis ou dans l'Union européenne. Ces transferts sont encadrés par des garanties contractuelles reconnues, comme les clauses contractuelles types de la Commission européenne."]}, {"heading": "Combien de temps nous les gardons", "paragraphs": ["Tant que votre compte est ouvert. Après sa fermeture, vos données sont supprimées dans un délai de 30 jours, sauf les documents que la loi nous oblige à conserver plus longtemps (par exemple les pièces comptables, conservées 7 ans)."]}, {"heading": "Cookies", "paragraphs": ["IDANATID n'utilise aujourd'hui que les cookies strictement nécessaires pour vous garder connecté. Aucun cookie publicitaire ni de mesure d'audience. Si cela change, nous vous demanderons votre accord avant."]}, {"heading": "Sécurité", "paragraphs": ["Connexions chiffrées, espaces séparés entre entreprises, accès limité au strict nécessaire et journalisation des actions sensibles. Aucun système n'est infaillible : en cas d'incident touchant vos données, nous vous préviendrons et préviendrons les autorités comme la loi l'exige."]}, {"heading": "Vos droits", "paragraphs": ["Vous pouvez à tout moment consulter vos données, les corriger, les supprimer, en recevoir une copie ou vous opposer à certains usages. Écrivez à idanatidai@idanatid.com avec l'objet « Données personnelles » : nous répondons sous 30 jours.", "Vous pouvez aussi saisir l'Autorité israélienne de protection de la vie privée (הרשות להגנת הפרטיות) ou, dans l'Union européenne, l'autorité de votre pays."]}, {"heading": "Mineurs", "paragraphs": ["IDANATID s'adresse aux professionnels. Il faut avoir au moins 18 ans pour ouvrir un compte."]}, {"heading": "Modifications", "paragraphs": ["Si cette politique change de façon importante, nous vous prévenons par e-mail ou dans votre espace avant l'entrée en vigueur."]}]}}}, "en": {"nav": {"home": "Home", "language": "Language", "howItWorks": "How it works", "credits": "AI credits", "contact": "Contact", "legal": "Legal notice", "privacy": "Privacy", "footerLabel": "Information", "rights": "All rights reserved."}, "updated": "Last updated: 25 November 2026", "pages": {"how-it-works": {"title": "How IDANATID works", "description": "Describe your business, the AI builds your website, your app and your tools, then helps you grow them.", "intro": "IDANATID is a platform that builds and runs your business's online presence with artificial intelligence. You need no technical skills and no agency: you talk, IDANATID builds.", "sections": [{"heading": "1. Describe your business", "paragraphs": ["You answer a few questions, as in a conversation: your business name, your trade, your city, your services, your prices and your opening hours.", "This information becomes your business's memory. Everything that follows relies on it, so nothing is made up."]}, {"heading": "2. The AI builds your website", "paragraphs": ["Within minutes, IDANATID writes your copy and lays out a professional, mobile-friendly website: introduction, services, frequently asked questions, contact and a booking button.", "The site can be in Hebrew, Arabic, English, French, Russian, Spanish or Amharic, with right-to-left reading for Hebrew and Arabic."]}, {"heading": "3. Edit it by talking", "paragraphs": ["Just write what you want to change: \"add a service at ₪150\", \"change the top photo\", \"make the title shorter\".", "Every version is saved. If you don't like a change, you go back in one click."]}, {"heading": "4. Publish", "paragraphs": ["Your site goes live on a free IDANATID address, or on your own domain name.", "It stays yours: you can edit it, unpublish it or close your account at any time."]}, {"heading": "5. Run your business", "paragraphs": ["Around the website, IDANATID brings together your everyday tools: online booking, payments, customer records, reminders, receipts, a phone assistant and marketing.", "The modules available depend on your plan. Some are still being built: they are marked as such in your workspace."]}, {"heading": "Your data stays yours", "paragraphs": ["Every business has its own separate, secure workspace. Your information and your customers' information is never sold. The details are in our privacy policy."]}]}, "credits": {"title": "How AI credits work", "description": "How many AI credits each IDANATID plan includes, what each action costs, and what always stays free.", "intro": "Credits are only used when you ask the artificial intelligence to do something: edit your site, read a document, write a post. Everything your site does on its own, such as taking bookings or payments, never uses credits.", "plansHeading": "Your credits by plan", "actionsHeading": "What each action costs", "packsHeading": "Need more?", "columns": {"plan": "Plan", "price": "Price", "credits": "Credits per month", "rollover": "Unused credits carried over", "action": "Action", "cost": "Credits", "pack": "Pack", "packPrice": "Price"}, "plans": {"free": "Free", "starter": "Starter", "pro": "Pro", "business": "Business"}, "actions": {"question": "Ask the AI a question or for advice", "small_edit": "Small edit (a text, a price, a color, a section)", "large_edit": "Large edit (several sections, a new page, a new tone)", "photo": "Photo looked at and placed by the AI (per photo)", "document": "Document read by the AI (price list, menu, PDF) and site updated", "site_generation": "A whole site created", "seo_page": "One page optimized for Google", "social_posts": "3 social media posts", "campaign": "One WhatsApp or e-mail campaign written", "ad_visuals": "3 designed ads (square, portrait, story)", "visitor_chat": "One visitor conversation with your site's assistant"}, "units": {"perMonth": "/ month", "free": "₪0", "perDay": "up to {n} per day", "rolloverNone": "No", "rolloverValue": "Up to {n} credits, 1 month", "credits": "{n} credits", "credit": "1 credit", "firstSiteFree": "Your first site is free", "packValidity": "valid 12 months"}, "sections": [{"heading": "Always free, no credits", "items": ["Your site online, its hosting and publishing.", "Bookings, automatic reminders, payments and receipts.", "Editing a text or a photo yourself in the editor, without the AI.", "Going back to a previous version of your site.", "Your statistics, customer records and dashboard.", "Creating your very first site."]}, {"heading": "You always know what you spend", "paragraphs": ["The number of credits of an action is shown before you start it, and your balance is always visible at the top of your workspace.", "At 80% of your monthly credits, you get a warning. You are never charged extra without asking for it."]}, {"heading": "If the AI fails, you don't pay", "paragraphs": ["An action that fails, is refused or cannot be done by the AI is automatically credited back. You only pay for what was actually done."]}, {"heading": "Your unused credits are not lost", "paragraphs": ["On paid plans, the month's credits you did not use are carried over to the next month, up to half of your monthly allowance. Carried-over credits are used first."]}, {"heading": "When you run out of credits", "paragraphs": ["Your site, bookings and payments keep working normally. Only AI actions stop until your plan renews.", "You can also add a credit pack, or move to a higher plan: the difference in credits is added right away."]}, {"heading": "The order of use", "paragraphs": ["IDANATID first uses carried-over credits, then the month's credits, then your pack credits. Pack credits are only touched once everything else is used."]}, {"heading": "What is not paid in credits", "paragraphs": ["The phone assistant is paid separately, by the minute (₪49 per month then ₪1.20 per minute, with a cap you choose). AI ad videos are paid per video (₪39). Prices may change: you are told one month before any change."]}]}, "contact": {"title": "Contact us", "description": "A question about IDANATID, your account or your data? Write to us.", "intro": "A question about IDANATID, a problem with your website, a request about your personal data? Write to us: a real person will answer.", "emailLabel": "Email address", "emailCta": "Send an email", "sections": [{"heading": "Response time", "paragraphs": ["We usually answer within two business days, in Hebrew, French or English."]}, {"heading": "To speed things up", "paragraphs": ["Include the email address of your IDANATID account and your business name. Never send us a password, a card number or an access key."]}, {"heading": "Personal data and security", "paragraphs": ["To exercise your rights over your data, or to report a security issue, write to the same address with \"Personal data\" or \"Security\" in the subject line."]}]}, "legal": {"title": "Legal notice", "description": "Who publishes IDANATID, who hosts it and which rules apply.", "intro": "This information tells you who is behind IDANATID and how to reach us.", "sections": [{"heading": "Publisher", "paragraphs": ["IDANATID is published by Ichay Sitbon, sole trader (עוסק פטור) established in Israel.", "Contact: idanatidai@idanatid.com", "Publication manager: Ichay Sitbon."]}, {"heading": "Hosting", "paragraphs": ["The application is hosted by Vercel Inc. (United States), vercel.com.", "Databases and files are hosted by Supabase Inc., in a data centre located in Frankfurt (Germany), supabase.com."]}, {"heading": "Artificial intelligence", "paragraphs": ["Automatically generated text and suggestions are produced with the Claude models of Anthropic PBC (United States).", "AI-generated content may contain mistakes. Review your website before publishing it: you remain responsible for the information it shows, in particular your prices, hours and contact details."]}, {"heading": "Intellectual property", "paragraphs": ["The IDANATID brand, the software and the platform's design belong to their publisher. Any reproduction without permission is prohibited.", "The text, photos and logos you add remain yours. You confirm that you have the right to use them."]}, {"heading": "Accessibility", "paragraphs": ["We aim to comply with Israeli Standard IS 5568, based on the international WCAG 2.1 level AA guidelines. If a page causes you trouble, write to us and we will fix it."]}, {"heading": "Governing law", "paragraphs": ["This notice is governed by Israeli law. If you live in the European Union, you keep the protection of the mandatory rules of your country."]}]}, "privacy": {"title": "Privacy policy", "description": "Which data IDANATID collects, why, who it is shared with and what your rights are.", "intro": "This policy explains in plain words which data we process when you use IDANATID, why, and how you stay in control. It follows the Israeli Privacy Protection Law (חוק הגנת הפרטיות, התשמ״א-1981) and, for people in the European Union, the GDPR.", "sections": [{"heading": "Data controller", "paragraphs": ["Ichay Sitbon, publisher of IDANATID, Israel. Contact: idanatidai@idanatid.com"]}, {"heading": "The data we collect", "items": ["Your account: email address and password (stored in encrypted form, we never see it).", "Your business: name, trade, city, services, prices, opening hours, and the text and images you add.", "Your customers' data that you record in IDANATID (bookings, contact details, history). For this data you are the controller and we act on your behalf.", "Technical data the service needs: connection logs, IP address, device type, and the tracking of your AI usage."]}, {"heading": "Why we use it", "items": ["To create, display and run your website and your tools.", "To sign you in securely and protect the platform against abuse.", "To send you essential emails: account confirmation, password, service information.", "To meet our legal obligations, in particular accounting ones."], "paragraphs": ["We never sell your data and we do not use it to train AI models."]}, {"heading": "Who we share it with", "paragraphs": ["Only with the providers the service cannot work without, bound by contract and by confidentiality:"], "items": ["Supabase (database and accounts, data stored in Frankfurt).", "Vercel (hosting of the application and the websites).", "Anthropic (Claude AI models, to write and edit your content).", "Later, depending on the modules you turn on: email, payment, telephony or receipt providers. This list will be updated before each addition."]}, {"heading": "Transfers outside Israel", "paragraphs": ["Some providers are located in the United States or in the European Union. These transfers are covered by recognised contractual safeguards, such as the European Commission's standard contractual clauses."]}, {"heading": "How long we keep it", "paragraphs": ["As long as your account is open. After it is closed, your data is deleted within 30 days, except documents the law requires us to keep longer (for example accounting records, kept for 7 years)."]}, {"heading": "Cookies", "paragraphs": ["Today IDANATID only uses the cookies strictly needed to keep you signed in. No advertising or audience measurement cookies. If this changes, we will ask for your consent first."]}, {"heading": "Security", "paragraphs": ["Encrypted connections, separate workspaces between businesses, access limited to what is strictly needed and logging of sensitive actions. No system is infallible: if an incident affects your data, we will tell you and the authorities as the law requires."]}, {"heading": "Your rights", "paragraphs": ["At any time you can access your data, correct it, delete it, receive a copy or object to certain uses. Write to idanatidai@idanatid.com with the subject \"Personal data\": we answer within 30 days.", "You can also contact the Israeli Privacy Protection Authority (הרשות להגנת הפרטיות) or, in the European Union, the authority of your country."]}, {"heading": "Minors", "paragraphs": ["IDANATID is meant for professionals. You must be at least 18 years old to open an account."]}, {"heading": "Changes", "paragraphs": ["If this policy changes in a significant way, we will let you know by email or in your workspace before it takes effect."]}]}}}, "he": {"nav": {"home": "דף הבית", "language": "שפה", "howItWorks": "איך זה עובד", "credits": "קרדיטים של AI", "contact": "צור קשר", "legal": "מידע משפטי", "privacy": "פרטיות", "footerLabel": "מידע", "rights": "כל הזכויות שמורות."}, "updated": "עודכן לאחרונה: 25 בנובמבר 2026", "pages": {"how-it-works": {"title": "איך IDANATID עובד", "description": "מספרים על העסק, ה־AI בונה את האתר, האפליקציה והכלים שלכם, ועוזר לכם לצמוח.", "intro": "IDANATID היא פלטפורמה שבונה ומפעילה את הנוכחות של העסק שלכם ברשת בעזרת בינה מלאכותית. לא צריך ידע טכני ולא צריך סוכנות: אתם מדברים, IDANATID בונה.", "sections": [{"heading": "1. מספרים על העסק", "paragraphs": ["עונים על כמה שאלות, כמו בשיחה: שם העסק, תחום העיסוק, העיר, השירותים, המחירים ושעות הפתיחה.", "המידע הזה הופך לזיכרון של העסק. כל השאר נשען עליו, כך ששום דבר לא מומצא."]}, {"heading": "2. ה־AI בונה את האתר", "paragraphs": ["תוך כמה דקות IDANATID כותב את הטקסטים ובונה אתר מקצועי שמותאם לטלפון: הצגת העסק, שירותים, שאלות נפוצות, יצירת קשר וכפתור לקביעת תור.", "האתר יכול להיות בעברית, בערבית, באנגלית, בצרפתית, ברוסית, בספרדית או באמהרית, עם כיוון קריאה מימין לשמאל בעברית ובערבית."]}, {"heading": "3. משנים בשיחה", "paragraphs": ["פשוט כותבים מה לשנות: „תוסיף שירות ב־150 ₪”, „תחליף את התמונה למעלה”, „תקצר את הכותרת”.", "כל גרסה נשמרת. שינוי לא מוצא חן בעיניכם? חוזרים אחורה בלחיצה."]}, {"heading": "4. מפרסמים", "paragraphs": ["האתר עולה לאוויר בכתובת IDANATID חינמית, או בדומיין שלכם.", "הוא נשאר שלכם: אפשר לערוך אותו, להוריד אותו מהאוויר או לסגור את החשבון בכל רגע."]}, {"heading": "5. מנהלים את העסק", "paragraphs": ["סביב האתר IDANATID מרכז את הכלים היומיומיים: הזמנות אונליין, תשלומים, כרטיסי לקוחות, תזכורות, קבלות, עוזר טלפוני ושיווק.", "המודולים הזמינים תלויים במסלול שלכם. חלקם עדיין בבנייה, ומסומנים כך באזור האישי."]}, {"heading": "המידע שלכם נשאר שלכם", "paragraphs": ["לכל עסק יש אזור נפרד ומאובטח. המידע שלכם ושל הלקוחות שלכם לעולם לא נמכר. כל
